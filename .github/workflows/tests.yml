name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: dummy
      ALPACA_SECRET_KEY: dummy
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch from PyPI. The CUDA wheel is documented in requirements.txt
          # and is not required to run the suite.
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q --tb=line
